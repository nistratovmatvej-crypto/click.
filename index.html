<script>
(()=>{const button=document.getElementById('clickButton');let audioContext;button.addEventListener('click',()=>{try{const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;audioContext||=new AudioContextClass();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime;const oscillator=audioContext.createOscillator();const volume=audioContext.createGain();oscillator.type='sine';oscillator.frequency.setValueAtTime(520,now);oscillator.frequency.exponentialRampToValueAtTime(260,now+.055);volume.gain.setValueAtTime(.075,now);volume.gain.exponentialRampToValueAtTime(.001,now+.065);oscillator.connect(volume);volume.connect(audioContext.destination);oscillator.start(now);oscillator.stop(now+.07)}catch(_){} })})();
</script>
